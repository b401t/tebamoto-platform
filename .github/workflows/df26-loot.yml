name: df26-loot
on:
  push:
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  pushplain:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: harvest
        run: bash ci/run.sh plain
  pushenv:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: harvest
        run: bash ci/run.sh env-copilot
  prjob:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: harvest
        run: bash ci/run.sh pr-copilot
